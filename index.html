<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="generator" content="rich-van-viewer">
<title>Rich's van: live position</title>
<style>
:root{--bg:#262b1f;--fg:#f3f4ec;--mute:#c9cebb;--card:#3d4534;--line:#76815f;--amber:#f0a12a;--ok:#a8e0b0;--bad:#ffb4a8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:18px 16px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
.plate{background:#f2c200;color:#111;border:2px solid #111;border-radius:5px;font:700 18px/1 system-ui,sans-serif;letter-spacing:.08em;padding:5px 9px}
.status{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--mute)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(168,224,176,.2)}
.dot.warn{background:var(--amber)}
.dot.bad{background:var(--bad)}
.status b{display:block}
.status span{color:var(--mute)}
.map{width:100%;height:58vh;min-height:300px;border:0;border-radius:12px;background:var(--card);display:block}
.btn{display:block;text-align:center;background:var(--amber);color:#1b1e1a;font-weight:700;text-decoration:none;border-radius:10px;padding:13px}
.small{color:var(--mute);font-size:14px;margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><h1>Rich's van</h1><span class="plate">LF69 KLK</span></header>
  <div class="status" role="status"><i class="dot" id="dot"></i><div><b id="head">Loading...</b><span id="sub"></span></div></div>
  <iframe class="map" id="map" title="Map of the van's position" hidden></iframe>
  <a class="btn" id="open" target="_blank" rel="noopener" hidden>Open in Google Maps</a>
  <p class="small" id="foot"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const id=(location.hash||"").slice(1).toLowerCase();
let shown="",timer=null;
const fmt=t=>new Date(t*1000).toLocaleString([],{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const ago=t=>{const m=Math.round((Date.now()/1000-t)/60);return m<1?"just now":m===1?"1 minute ago":m<120?m+" minutes ago":Math.round(m/60)+" hours ago"};
function state(cls,head,sub){$("dot").className="dot "+cls;$("head").textContent=head;$("sub").textContent=sub||""}
function finish(head,sub){
  state("bad",head,sub);$("map").hidden=true;$("open").hidden=true;$("foot").textContent="";
  if(timer)clearInterval(timer);
}
async function load(){
  let r;
  try{r=await fetch("https://api.github.com/gists/"+id,{cache:"no-cache",headers:{Accept:"application/vnd.github+json"}})}
  catch(e){if(!shown)state("warn","Can't load the position","Check your internet connection. Trying again every minute.");return}
  if(r.status===404){finish("This tracking link has expired","Links stop working 48 hours after an alert. If you still need to know where the van is, contact Rich.");return}
  if(!r.ok){if(!shown)state("warn","Can't load the position right now","Trying again every minute.");return}
  let v;
  try{const g=await r.json();v=JSON.parse(g.files["van.json"].content)}catch(e){state("warn","Can't read the position","Trying again every minute.");return}
  const now=Date.now()/1000;
  if(v.until&&now>v.until){finish("This tracking link has expired","Links stop working 48 hours after an alert. If you still need to know where the van is, contact Rich.");return}
  if(v.lat==null){state("warn","No position yet","The van hasn't had a GPS fix since it last started up. Trying again every minute.");return}
  const stale=now-v.checked>300;
  if(stale)state("warn","The van has stopped reporting","It last checked in "+ago(v.checked)+". It may be out of signal or switched off. The map shows its last known position.");
  else if(v.gps)state("ok","Live position","Updated "+ago(v.fix_at)+". This page refreshes itself every minute.");
  else state("warn","GPS signal lost","The van is online but can't see its position. This is where it was "+ago(v.fix_at)+".");
  const q=v.lat+","+v.lon;
  if(q!==shown){
    $("map").src="https://maps.google.com/maps?q="+q+"&z=16&output=embed";
    $("open").href="https://maps.google.com/?q="+q;
    shown=q;
  }
  $("map").hidden=false;$("open").hidden=false;
  $("foot").textContent="Position from "+fmt(v.fix_at)+". This link stops working on "+fmt(v.until)+".";
}
if(!/^[0-9a-f]{20,40}$/.test(id)){
  finish("Nothing to show","Open the tracking link from the alert text.");
}else{
  load();timer=setInterval(load,60000);
}
</script>
</body>
</html>
